<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>2024 AMC 8 Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: a single test-booklet page, one problem at a time, under a slim progress header */
:root {
  --paper: #f3f7f4;
  --page: #ffffff;
  --ink: #1c2220;
  --muted: #5b6862;
  --line: #d2dfd7;
  --sheet: #2b7553;
  --sheet-soft: #e5f0ea;
  --graphite: #262b29;
  --on-graphite: #ffffff;
  --right: #157a45;
  --right-soft: #e1f3e8;
  --wrong: #c03a29;
  --wrong-soft: #fbe8e5;
  --fig-bg: #ffffff;
  --fig-border: transparent;
  --display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "STIX Two Text", "Times New Roman", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1412; --page: #151d1a; --ink: #e3eae6; --muted: #96a59e; --line: #2a3832;
    --sheet: #6ecb9d; --sheet-soft: #182621;
    --graphite: #e3eae6; --on-graphite: #0e1412;
    --right: #56d18f; --right-soft: #15301f; --wrong: #ff8b76; --wrong-soft: #3a1c17;
    --fig-bg: #ffffff; --fig-border: #3b4b44;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1412; --page: #151d1a; --ink: #e3eae6; --muted: #96a59e; --line: #2a3832;
  --sheet: #6ecb9d; --sheet-soft: #182621;
  --graphite: #e3eae6; --on-graphite: #0e1412;
  --right: #56d18f; --right-soft: #15301f; --wrong: #ff8b76; --wrong-soft: #3a1c17;
  --fig-bg: #ffffff; --fig-border: #3b4b44;
  color-scheme: dark;
}

body { background: var(--paper); color: var(--ink); font-family: var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sheet); outline-offset: 2px; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--page); border-bottom: 1px solid var(--line); }
.top-in, .wrap, .confirm-in {
  max-width: 820px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 10px 9px; }
.brand { display: flex; align-items: baseline; gap: .35em; font-family: var(--display); font-weight: 700; font-size: 1.5rem; line-height: 1; }
.brand-year { color: var(--sheet); font-weight: 600; }
.status { margin-left: auto; display: flex; align-items: center; gap: 16px; font: 500 .82rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.status strong { color: var(--ink); font-weight: 600; }
.bar { height: 4px; background: var(--line); }
.bar span { display: block; height: 100%; background: var(--sheet); transition: width .3s; }
.confirm { border-top: 1px solid var(--line); background: var(--sheet-soft); }
.confirm-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 10px; font-size: 1.05rem; }
.confirm-in span { flex: 1 1 240px; }

.wrap { padding-block: 24px 56px; }

/* Booklet page */
.booklet { background: var(--page); border: 1px solid var(--line); border-radius: 4px; padding: clamp(18px, 4vw, 40px); }
.p-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 10px; margin-bottom: 14px; font-family: var(--display); }
.p-num { font-size: 1.7rem; font-weight: 700; line-height: 1.1; }
.p-of { color: var(--muted); font-weight: 500; font-size: 1.05rem; }
.p-text { font-size: 1.2rem; line-height: 1.6; max-width: 64ch; }
.p-text p { margin: 0 0 .7em; }
.p-text p:last-child { margin-bottom: 0; }
.display { text-align: center; font-size: 1.25rem; margin: .5em 0 .8em; }
.bullets { margin: .2em 0 .8em; padding-left: 1.3em; }
.fig { margin: 20px 0 4px; display: flex; justify-content: center; }
.fig-card { min-width: 0; max-width: 100%; background: var(--fig-bg); border: 1px solid var(--fig-border); border-radius: 6px; padding: 10px; }
.fig img { display: block; max-width: 100%; height: auto; }

/* Math bits */
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .92em; line-height: 1.15; margin: 0 .12em; }
.frac > span { padding: 0 .15em; }
.frac > span:last-child { border-top: 1px solid currentColor; padding-top: 1px; }
.sqrt > span { border-top: 1px solid currentColor; padding-left: .05em; }
.dg i { text-decoration: underline; text-underline-offset: 3px; margin: 0 .09em; }

/* Answer choices */
.choices { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.choice { display: inline-flex; align-items: center; gap: 10px; min-height: 50px; padding: 8px 18px 8px 9px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--page); color: var(--ink); cursor: pointer; font: 1.15rem var(--body); text-align: left; transition: border-color .15s, background-color .15s; }
.choice:hover:not([aria-disabled="true"]) { border-color: var(--sheet); }
.choice[aria-disabled="true"] { cursor: default; }
.bubble { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--sheet); color: var(--sheet); font: 600 .8rem var(--mono); transition: background-color .15s; }
.choice.is-right { border-color: var(--right); background: var(--right-soft); }
.choice.is-right .bubble { border-color: var(--right); color: var(--right); }
.choice.is-right.picked .bubble { background: var(--right); color: var(--page); }
.choice.is-wrong { border-color: var(--wrong); background: var(--wrong-soft); }
.choice.is-wrong .bubble { background: var(--wrong); border-color: var(--wrong); color: var(--page); }

/* Feedback */
.feedback { margin-top: 22px; padding: 14px 18px; border: 1.5px solid var(--right); border-radius: 8px; background: var(--right-soft); display: grid; gap: 6px; }
.feedback.bad { border-color: var(--wrong); background: var(--wrong-soft); }
.fb-title { font: 700 1.2rem var(--display); color: var(--right); }
.feedback.bad .fb-title { color: var(--wrong); }
.fb-why { font-size: 1.07rem; line-height: 1.55; max-width: 66ch; }
.fb-why b { font-family: var(--display); letter-spacing: .03em; text-transform: uppercase; font-size: .8rem; color: var(--muted); margin-right: .4em; }

/* Buttons */
.btn { padding: 10px 18px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--page); color: var(--ink); cursor: pointer; font: 600 1rem var(--display); letter-spacing: .02em; }
.btn:hover:not(:disabled) { border-color: var(--sheet); }
.btn.primary { background: var(--sheet); border-color: var(--sheet); color: var(--page); }
.btn:disabled { opacity: .4; cursor: default; }
.link { border: 0; background: none; padding: 0; color: var(--sheet); cursor: pointer; font: 600 .95rem var(--display); letter-spacing: .02em; text-decoration: underline; text-underline-offset: 3px; }
.p-nav { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 28px; padding-top: 18px; border-top: 1px dashed var(--line); }
.p-nav .end { margin-left: auto; display: flex; gap: 10px; }
.hint { color: var(--muted); font: .78rem var(--mono); }
@media (hover: none) { .hint { display: none; } }

/* Results */
.eyebrow { margin: 0 0 6px; color: var(--sheet); font: 700 .85rem var(--display); letter-spacing: .1em; text-transform: uppercase; }
.score { display: flex; align-items: baseline; gap: .15em; font-family: var(--display); font-weight: 700; font-size: clamp(3.6rem, 11vw, 5.6rem); line-height: 1; font-variant-numeric: tabular-nums; }
.score .of { font-size: .42em; color: var(--muted); font-weight: 600; }
.score-note { margin: 8px 0 16px; color: var(--muted); font-size: 1.02rem; }
.tallies { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.tally { padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; font: 500 .82rem var(--mono); font-variant-numeric: tabular-nums; }
.tally.good { color: var(--right); border-color: var(--right); }
.tally.bad { color: var(--wrong); border-color: var(--wrong); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.results h2 { margin: 32px 0 10px; font: 700 1.3rem var(--display); }
.table-wrap { overflow-x: auto; }
.rt { width: 100%; border-collapse: collapse; font-size: 1.02rem; }
.rt th { text-align: left; padding: 6px 10px; color: var(--muted); font: 600 .78rem var(--display); letter-spacing: .08em; text-transform: uppercase; border-bottom: 1.5px solid var(--line); }
.rt td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
.chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font: 600 .8rem var(--display); letter-spacing: .04em; border: 1px solid var(--line); color: var(--muted); }
.chip.good { color: var(--right); border-color: var(--right); background: var(--right-soft); }
.chip.bad { color: var(--wrong); border-color: var(--wrong); background: var(--wrong-soft); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

const P = [
  { q: `<p>What is the ones digit of</p><div class="display">222,222 − 22,222 − 2,222 − 222 − 22 − 2 ?</div>`,
    c: ["0", "2", "4", "6", "8"],
    why: `Subtract step by step: 222,222 − 22,222 = 200,000, then 200,000 − 2,222 = 197,778, − 222 = 197,556, − 22 = 197,534, − 2 = 197,532. The ones digit is 2.` },
  { q: `<p>What is the value of this expression in decimal form?</p><div class="display">${F(44, 11)} + ${F(110, 44)} + ${F(44, 1100)}</div>`,
    c: ["6.4", "6.504", "6.54", "6.9", "6.94"],
    why: `44/11 = 4, 110/44 = 2.5, and 44/1100 = 0.04. The sum is 6.54.` },
  { q: `<p>Four squares of side length 4, 7, 9, and 10 units are arranged in increasing size order so that their left edges and bottom edges align. The squares alternate in color white-gray-white-gray, respectively, as shown in the figure. What is the area of the visible gray region in square units?</p>`,
    c: ["42", "45", "49", "50", "52"],
    why: `The visible gray is two L-shapes: (10² − 9²) + (7² − 4²) = 19 + 33 = 52.` },
  { q: `<p>When Yunji added all the integers from 1 through 9, she mistakenly left out a number. Her incorrect sum turned out to be a square number. Which number did Yunji leave out?</p>`,
    c: ["5", "6", "7", "8", "9"],
    why: `1 + 2 + ⋯ + 9 = 45. Leaving out 9 gives 36 = 6². Leaving out 5, 6, 7, or 8 gives 40, 39, 38, or 37, none of which are squares.` },
  { q: `<p>Aaliyah rolls two standard 6-sided dice. She notices that the product of the two numbers rolled is a multiple of 6. Which of the following integers <i>cannot</i> be the sum of the two numbers?</p>`,
    c: ["5", "6", "7", "8", "9"],
    why: `A sum of 6 comes from 1+5, 2+4, or 3+3, with products 5, 8, and 9. None is a multiple of 6. The other sums work: 5 = 2+3, 7 = 1+6, 8 = 2+6, 9 = 3+6.` },
  { q: `<p>Sergei skated around an ice rink, gliding along different paths. The gray lines in the figures below show four of the paths labeled P, Q, R, and S. What is the sorted order of the four paths from shortest to longest?</p>`,
    c: ["P, Q, R, S", "P, R, S, Q", "Q, S, P, R", "R, P, S, Q", "R, S, P, Q"],
    why: `R cuts across the curved ends with straight lines, so it is shorter than P, which follows the whole oval. S swaps P's two straight sides for two diagonals, which are longer. Q zig-zags with four diagonals instead of two, so it is the longest. Order: R, P, S, Q.` },
  { q: `<p>A 3 × 7 rectangle is covered without overlap by 3 shapes of tiles: 2 × 2, 1 × 4, and 1 × 1, shown below. What is the minimum possible number of 1 × 1 tiles used?</p>`,
    c: ["1", "2", "3", "4", "5"],
    why: `The area is 21 and each big tile covers 4, so the number of 1 × 1 tiles is 1, 5, 9, … Color columns 1, 3, 5, 7 (12 cells) and leave columns 2, 4, 6 white (9 cells). Every 2 × 2 or 1 × 4 tile covers exactly 2 colored and 2 white cells, so the 1 × 1 tiles must make up a difference of 3. That needs at least 3 small tiles, so the minimum is 5, which is achievable.` },
  { q: `<p>On Monday Taye has $2. Every day, he either gains $3 or doubles the amount of money he had on the previous day. How many different dollar amounts could Taye have on Thursday, 3 days later?</p>`,
    c: ["3", "4", "5", "6", "7"],
    why: `Tuesday: 5 or 4. Wednesday: 8, 10, 7, 8, so {7, 8, 10}. Thursday: 10, 14, 11, 16, 13, 20, which is 6 different amounts.` },
  { q: `<p>All of the marbles in Maria's collection are red, green, or blue. Maria has half as many red marbles as green marbles and twice as many blue marbles as green marbles. Which of the following could be the total number of marbles in Maria's collection?</p>`,
    c: ["24", "25", "26", "27", "28"],
    why: `If red = r, then green = 2r and blue = 4r, so the total is 7r. The total must be a multiple of 7, and 28 is the only choice that is.` },
  { q: `<p>In January 1980 the Mauna Loa Observatory recorded carbon dioxide (CO<sub>2</sub>) levels of 338 ppm (parts per million). Over the years the average CO<sub>2</sub> reading has increased by about 1.515 ppm each year. What is the expected CO<sub>2</sub> level in ppm in January 2030? Round your answer to the nearest integer.</p>`,
    c: ["399", "414", "420", "444", "459"],
    why: `That is 50 years: 50 × 1.515 = 75.75. Then 338 + 75.75 = 413.75, which rounds to 414.` },
  { q: `<p>The coordinates of △<i>ABC</i> are <i>A</i>(5, 7), <i>B</i>(11, 7) and <i>C</i>(3, <i>y</i>), with <i>y</i> &gt; 7. The area of △<i>ABC</i> is 12. What is the value of <i>y</i>?</p>`,
    c: ["8", "9", "10", "11", "12"],
    why: `Use AB as the base: it is horizontal with length 6. The height is y − 7. So ½ · 6 · (y − 7) = 12, which gives y − 7 = 4 and y = 11.` },
  { q: `<p>Rohan keeps a total of 90 guppies in 4 fish tanks.</p><ul class="bullets"><li>There is 1 more guppy in the 2nd tank than in the 1st tank.</li><li>There are 2 more guppies in the 3rd tank than in the 2nd tank.</li><li>There are 3 more guppies in the 4th tank than in the 3rd tank.</li></ul><p>How many guppies are in the 4th tank?</p>`,
    c: ["20", "21", "23", "24", "26"],
    why: `The tanks hold x, x + 1, x + 3, x + 6. So 4x + 10 = 90, x = 20, and the 4th tank has 26.` },
  { q: `<p>Buzz Bunny is hopping up and down a set of stairs, one step at a time. In how many ways can Buzz start on the ground, make a sequence of 6 hops, and end up back on the ground? (For example, one sequence of hops is up-up-down-down-up-down.)</p>`,
    c: ["4", "5", "6", "8", "12"],
    why: `Buzz needs 3 ups and 3 downs and can never go below the ground. The valid orders are UUUDDD, UUDUDD, UUDDUD, UDUUDD, and UDUDUD: 5 ways.` },
  { q: `<p>The one-way routes connecting towns <i>A</i>, <i>M</i>, <i>C</i>, <i>X</i>, <i>Y</i>, and <i>Z</i> are shown in the figure below (not drawn to scale). The distances in kilometers along each route are marked. Traveling along these routes, what is the shortest distance from <i>A</i> to <i>Z</i> in kilometers?</p>`,
    c: ["28", "29", "30", "31", "32"],
    why: `The cheapest way to M is A→X→M = 7 (better than 8). From M, the best finish is M→Y→C→Z = 6 + 5 + 10 = 21, for a total of 28. The other finishes give 30 (via Y→Z), 31 (via M→C), and 32 (M→Z directly).` },
  { q: `<p>Let the letters <i>F</i>, <i>L</i>, <i>Y</i>, <i>B</i>, <i>U</i>, <i>G</i> represent distinct digits. Suppose ${D("FLYFLY")} is the greatest number that satisfies the equation</p><div class="display">8 · ${D("FLYFLY")} = ${D("BUGBUG")} .</div><p>What is the value of ${D("FLY")} + ${D("BUG")}?</p>`,
    c: ["1089", "1098", "1107", "1116", "1125"],
    why: `FLYFLY = FLY × 1001 and BUGBUG = BUG × 1001, so 8 · FLY = BUG. Since BUG ≤ 999, FLY ≤ 124. FLY = 124 gives 992 (repeated digit), but FLY = 123 gives 984, and the digits 1, 2, 3, 9, 8, 4 are all different. So 123 + 984 = 1107.` },
  { q: `<p>Minh enters the numbers 1 through 81 into the cells of a 9 × 9 grid in some order. She calculates the product of the numbers in each row and column. What is the least number of rows and columns that could have a product divisible by 3?</p>`,
    c: ["8", "9", "10", "11", "12"],
    why: `There are 27 multiples of 3 from 1 to 81, and any row or column holding one has a product divisible by 3. Pack them into an a × b block with ab ≥ 27. With a + b = 10 the most you can fit is 5 × 5 = 25, which is too few. A 5 × 6 block holds 30, so the minimum is 5 + 6 = 11.` },
  { q: `<p>A chess king is said to <i>attack</i> all the squares one step away from it, horizontally, vertically, or diagonally. For instance, a king on the center square of a 3 × 3 grid attacks all 8 other squares, as shown below. Suppose a white king and a black king are placed on different squares of a 3 × 3 grid so that they do not attack each other. In how many ways can this be done?</p>`,
    c: ["20", "24", "27", "28", "32"],
    why: `Place the white king first. In a corner (4 squares) it attacks 3 squares, leaving 5 safe spots. On an edge (4 squares) it attacks 5, leaving 3. In the center it attacks everything. Total: 4 · 5 + 4 · 3 = 32.` },
  { q: `<p>Three concentric circles centered at <i>O</i> have radii of 1, 2, and 3. Points <i>B</i> and <i>C</i> lie on the largest circle. The region between the two smaller circles is shaded, as is the portion of the region between the two larger circles bounded by central angle <i>BOC</i>, as shown in the figure below. Suppose the shaded and unshaded regions are equal in area. What is the measure of ∠<i>BOC</i> in degrees?</p>`,
    c: ["108", "120", "135", "144", "150"],
    why: `The whole disk is 9π, so the shaded part must be 4.5π. The inner ring is π(4 − 1) = 3π, so the slice of the outer ring must be 1.5π. The outer ring is π(9 − 4) = 5π, so the angle is 1.5/5 of 360°, which is 108°.` },
  { q: `<p>Jordan owns 15 pairs of sneakers. Three fifths of the pairs are red and the rest are white. Two thirds of the pairs are high-top and the rest are low-top. The red high-top sneakers make up a fraction of the collection. What is the least possible value of this fraction?</p>`,
    c: ["0", F(1, 5), F(4, 15), F(1, 3), F(2, 5)],
    why: `There are 9 red and 6 white pairs, and 10 high-top and 5 low-top pairs. At most 6 of the high-tops can be white, so at least 10 − 6 = 4 are red. The fraction is 4/15.` },
  { q: `<p>Any three vertices of the cube <i>PQRSTUVW</i>, shown in the figure below, can be connected to form a triangle. (For example, vertices <i>P</i>, <i>Q</i>, and <i>R</i> can be connected to form isosceles △<i>PQR</i>.) How many of these triangles are equilateral and contain <i>P</i> as a vertex?</p>`,
    c: ["0", "1", "2", "3", "6"],
    why: `An equilateral triangle on a cube's vertices has face diagonals for all three sides. P has a face diagonal to 3 vertices (R, T, V), and each pair of those is also a face diagonal apart. Choosing 2 of the 3 gives 3 triangles.` },
  { q: `<p>A group of frogs (called an <i>army</i>) is living in a tree. A frog turns green when in the shade and turns yellow when in the sun. Initially the ratio of green to yellow frogs was 3 : 1. Then 3 green frogs moved to the sunny side and 5 yellow frogs moved to the shady side. Now the ratio is 4 : 1. What is the difference between the number of green frogs and yellow frogs now?</p>`,
    c: ["10", "12", "16", "20", "24"],
    why: `Start with 3y green and y yellow. Afterward there are 3y − 3 + 5 = 3y + 2 green and y + 3 − 5 = y − 2 yellow. Setting 3y + 2 = 4(y − 2) gives y = 10. Now there are 32 green and 8 yellow, a difference of 24.` },
  { q: `<p>A roll of tape is 4 inches in diameter and is wrapped around a ring that is 2 inches in diameter. A cross section of the tape is shown in the figure below. The tape is 0.015 inches thick. If the tape is completely unrolled, approximately how long would it be? Round your answer to the nearest 100 inches.</p>`,
    c: ["300", "600", "1200", "1500", "1800"],
    why: `The tape's cross section is a ring with area π(2² − 1²) = 3π ≈ 9.42 square inches. Unrolled, that same area is a long thin strip 0.015 in. thick, so its length is about 9.42 ÷ 0.015 ≈ 628, or 600 to the nearest 100.` },
  { q: `<p>Rodrigo has a very large piece of graph paper. First he draws a line segment connecting point (0, 4) to point (2, 0) and colors the 4 cells whose interiors intersect the segment, as shown below. Next Rodrigo draws a line segment connecting point (2000, 3000) to point (5000, 8000). Again he colors the cells whose interiors intersect the segment. How many cells will he color this time?</p>`,
    c: ["6000", "6500", "7000", "7500", "8000"],
    why: `The segment goes 3000 across and 5000 up. It splits into 1000 identical pieces, each going 3 across and 5 up between lattice points. Each piece crosses 3 + 5 − 1 = 7 cells, so the total is 7 × 1000 = 7000. (Check with the example: 2 across, 4 up is 2 pieces of 1 + 2 − 1 = 2 cells, so 4 cells.)` },
  { q: `<p>Jean made a piece of stained glass art in the shape of two mountains, as shown in the figure below. One mountain peak is 8 feet high and the other peak is 12 feet high. Each peak forms a 90° angle, and the straight sides of the mountains form 45° angles with the ground. The artwork has an area of 183 square feet. The sides of the mountains meet at an intersection point near the center of the artwork, <i>h</i> feet above the ground. What is the value of <i>h</i>?</p>`,
    c: ["4", "5", `4${R(2)}`, "6", `5${R(2)}`],
    why: `Each mountain is an isosceles right triangle, and one with height k has base 2k and area k². The two full mountains have area 64 + 144 = 208, but they overlap in a small triangle of height h and area h². So 208 − h² = 183, h² = 25, and h = 5.` },
  { q: `<p>A small airplane has 4 rows of seats with 3 seats in each row. Eight passengers have boarded the plane and are distributed randomly among the seats. A married couple is next to board. What is the probability there will be 2 adjacent seats in the same row for the couple?</p>`,
    c: [F(8, 15), F(32, 55), F(20, 33), F(34, 55), F(8, 11)],
    why: `The 4 empty seats are a random 4 of the 12: C(12, 4) = 495 ways. Count the bad cases with no two empty seats side by side. In one row that allows 0 empty seats (1 way), 1 empty (3 ways), or 2 empty in the two end seats (1 way). The number of ways to total 4 empty seats over 4 rows is the x⁴ coefficient of (1 + 3x + x²)⁴, which is 195. So the probability is 1 − 195/495 = 300/495 = 20/33.` },
];
P.forEach((p, i) => { p.a = KEY[i]; p.fig = FIGS[i + 1] || null; });

const $ = s => document.querySelector(s);
const fresh = () => ({ answers: Array(25).fill(null), cur: 0, done: false, view: "problem" });
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE));
    if (s && Array.isArray(s.answers) && s.answers.length === 25) return s;
  } catch (e) {}
  return null;
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }

let S = load() || fresh();
let confirming = false;

const answered = () => S.answers.filter(Boolean).length;
const correct = () => S.answers.filter((a, i) => a === KEY[i]).length;
const choiceText = (i, L) => `(${L}) ${P[i].c[LETTERS.indexOf(L)]}`;

function render() {
  const n = answered();
  $("#status-text").innerHTML = S.done
    ? `Final score <strong>${correct()} / 25</strong>`
    : `Problem <strong>${S.cur + 1}</strong> of 25 · <strong>${correct()}</strong> correct`;
  $("#bar").style.width = `${(n / 25) * 100}%`;
  $("#restart-btn").hidden = n === 0;
  $("#confirm").hidden = !confirming;
  if (confirming) $("#confirm-msg").textContent = S.done
    ? "Start the quiz over from Problem 1?"
    : `Start over from Problem 1? This erases your ${n} answer${n === 1 ? "" : "s"}.`;
  $("#booklet").innerHTML = S.view === "results" ? resultsHTML() : problemHTML(S.cur);
  save();
}

function problemHTML(i) {
  const p = P[i], mine = S.answers[i], graded = mine !== null;
  const choices = p.c.map((v, k) => {
    const L = LETTERS[k];
    let cls = "choice";
    if (mine === L) cls += " picked";
    if (graded && L === p.a) cls += " is-right";
    else if (graded && mine === L) cls += " is-wrong";
    return `<button class="${cls}" data-choice="${L}" aria-pressed="${mine === L}"${graded ? ' aria-disabled="true"' : ""}><span class="bubble">${L}</span><span class="val">${v}</span></button>`;
  }).join("");
  let fb = "";
  if (graded) {
    const ok = mine === p.a;
    const title = ok ? "✓ Correct" : `✗ Not quite. The answer is ${choiceText(i, p.a)}.`;
    fb = `<div class="feedback${ok ? "" : " bad"}"><div class="fb-title">${title}</div><div class="fb-why"><b>How to get it</b>${p.why}</div></div>`;
  }
  const fig = p.fig ? `<figure class="fig"><div class="fig-card"><img src="${p.fig.src}" width="${p.fig.w}" alt="Figure for problem ${i + 1}"></div></figure>` : "";
  let nav;
  if (S.done) {
    nav = `<button class="link" data-results>Back to score</button><span class="end">
      <button class="btn" data-review="${i - 1}"${i === 0 ? " disabled" : ""}>← Previous</button>
      ${i < 24 ? `<button class="btn primary" data-review="${i + 1}">Next →</button>` : `<button class="btn primary" data-results>Back to score</button>`}</span>`;
  } else if (graded) {
    nav = `<span class="hint">Press Enter for the next problem</span><span class="end"><button class="btn primary" id="next-btn" data-next>${i < 24 ? "Next problem →" : "See your score"}</button></span>`;
  } else {
    nav = `<span class="hint">Pick an answer, or press A–E</span>`;
  }
  return `<article>
    <div class="p-head"><span class="p-num">Problem ${i + 1}</span><span class="p-of">of 25</span></div>
    <div class="p-text">${p.q}</div>
    ${fig}
    <div class="choices" role="group" aria-label="Answer choices">${choices}</div>
    <div aria-live="polite">${fb}</div>
    <nav class="p-nav">${nav}</nav>
  </article>`;
}

function resultsHTML() {
  const right = correct(), wrong = 25 - right;
  const rows = P.map((p, i) => {
    const mine = S.answers[i];
    const chip = mine === p.a ? `<span class="chip good">Correct</span>` : `<span class="chip bad">Wrong</span>`;
    return `<tr><td><button class="link" data-review="${i}">Problem ${i + 1}</button></td><td>${mine ? choiceText(i, mine) : "—"}</td><td>${choiceText(i, p.a)}</td><td>${chip}</td></tr>`;
  }).join("");
  return `<div class="results">
    <p class="eyebrow">Your score</p>
    <div class="score"><span>${right}</span><span class="of">/ 25</span></div>
    <p class="score-note">Scored like the real AMC 8: 1 point for each correct answer.</p>
    <div class="tallies">
      <span class="tally good">${right} correct</span>
      <span class="tally bad">${wrong} wrong</span>
    </div>
    <div class="actions">
      <button class="btn primary" data-review="0">Review the problems</button>
      <button class="btn" data-again>Take the quiz again</button>
    </div>
    <h2>Problem by problem</h2>
    <div class="table-wrap"><table class="rt">
      <thead><tr><th>Problem</th><th>Your answer</th><th>Correct answer</th><th>Result</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function choose(L) {
  if (S.view !== "problem" || S.done || S.answers[S.cur]) return;
  S.answers[S.cur] = L;
  render();
  const nb = $("#next-btn");
  if (nb) nb.focus({ preventScroll: true });
}

function next() {
  if (S.done || !S.answers[S.cur]) return;
  if (S.cur < 24) S.cur += 1;
  else { S.done = true; S.view = "results"; }
  render();
  window.scrollTo({ top: 0 });
}

function startOver() {
  S = fresh();
  confirming = false;
  render();
  window.scrollTo({ top: 0 });
}

document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.id === "restart-btn") { confirming = true; render(); return; }
  if (t.id === "confirm-yes") { startOver(); return; }
  if (t.id === "confirm-no") { confirming = false; render(); return; }
  if (t.dataset.choice) { if (t.getAttribute("aria-disabled") !== "true") choose(t.dataset.choice); return; }
  if (t.hasAttribute("data-next")) { next(); return; }
  if (t.dataset.review !== undefined) { S.cur = +t.dataset.review; S.view = "problem"; render(); window.scrollTo({ top: 0 }); return; }
  if (t.hasAttribute("data-results")) { S.view = "results"; render(); window.scrollTo({ top: 0 }); return; }
  if (t.hasAttribute("data-again")) { startOver(); return; }
});

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || S.view !== "problem" || S.done) return;
  const k = e.key.toUpperCase();
  const idx = k.length === 1 ? (LETTERS.indexOf(k) >= 0 ? LETTERS.indexOf(k) : "12345".indexOf(k)) : -1;
  if (idx >= 0 && !S.answers[S.cur]) { e.preventDefault(); choose(LETTERS[idx]); }
  else if (e.key === "Enter" && S.answers[S.cur] && e.target.id !== "next-btn") { e.preventDefault(); next(); }
});

render();
</script>

</body>
</html>
